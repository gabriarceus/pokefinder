name: pokefinder
description: The best app to find information about Pokémon.
publish_to: "none"
version: 1.0.0-rc1+2

environment:
  sdk: ^3.11.0

dependencies:
  bloc: ^9.0.1
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_spinkit: ^5.2.1
  injectable: ^2.7.1
  get_it: ^9.2.1
  go_router: ^17.2.2
  meta: ^1.12.0
  json_annotation: ^4.12.0
  flutter_localizations:
    sdk: flutter
  intl: any
  dartz: ^0.10.1
  just_audio: ^0.10.4
  hydrated_bloc: ^11.0.0
  hive_ce: ^2.10.1
  path_provider: ^2.1.5
  en_logger: ^1.2.0
  just_audio_media_kit: ^2.1.0
  # Native audio libraries required by just_audio_media_kit on iOS.
  # Not imported from Dart: do not drop it as an unused dependency.
  media_kit_libs_ios_audio: ^1.1.4
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.3.3
  json_serializable: ^6.8.0
  injectable_generator: ^2.11.1
  mocktail: ^1.0.4
  network_image_mock: ^2.0.1
  path: ^1.9.1
  yaml: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/sad_azurill.png
