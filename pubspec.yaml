name: pokefinder
description: The best app to find information about Pokémon.
publish_to: "none"
version: 1.0.0-rc2+3

environment:
  sdk: ^3.11.0

dependencies:
  # Framework & Localization
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI & Navigation
  flutter_spinkit: ^5.2.1
  go_router: ^18.1.4
  material_ui: ^1.11.0

  # State, DI & Functional
  bloc: ^9.0.1
  bloc_concurrency: ^0.3.0
  dartz: ^0.10.1
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  hydrated_bloc: ^11.0.0
  injectable: ^3.0.0

  # Networking, Storage & Serialization
  dio: ^5.9.2
  hive_ce: ^2.10.1
  json_annotation: ^4.12.0
  path_provider: ^2.1.5

  # Audio, Platform & Utilities
  clock: ^1.1.2
  en_logger: ^2.1.0
  just_audio: ^0.10.4
  just_audio_media_kit: ^2.1.0
  # Native audio libraries required by just_audio_media_kit on iOS.
  # Not imported from Dart: do not drop it as an unused dependency.
  media_kit_libs_ios_audio: ^1.1.4
  meta: ^1.12.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  # Testing & Linting
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  network_image_mock: ^2.0.1

  # Code Generation
  build_runner: ^2.3.3
  injectable_generator: ^3.1.3
  json_serializable: ^6.8.0

  # Tooling & Build Scripts
  path: ^1.9.1
  yaml: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/sad_azurill.png
