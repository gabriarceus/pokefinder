name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


jobs:
  verify:
    name: Quality Gates & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Setup FVM compatibility alias
        run: |
          mkdir -p ~/.local/bin
          echo '#!/usr/bin/env bash' > ~/.local/bin/fvm
          echo 'exec "$@"' >> ~/.local/bin/fvm
          chmod +x ~/.local/bin/fvm
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Flutter SDK version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Validate localization generation
        run: flutter gen-l10n

      - name: Run code generation
        run: dart run build_runner build

      - name: Verify no uncommitted generated diffs
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Uncommitted or untracked changes detected after code generation or localization."
            git status --short
            exit 1
          fi

      - name: Run test suite with coverage and verify threshold
        run: |
          if [ -f "scripts/coverage.sh" ]; then
            bash scripts/coverage.sh 70
          else
            flutter test --coverage
          fi

  build:
    name: Representative Release Build
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android APK (dev flavor, release mode)
        run: flutter build apk --flavor dev --release
